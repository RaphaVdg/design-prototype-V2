/* plan actions */
function setPlanView(v){ state.planView=v; state.planMenuOpen=null; render(); }
function togglePlanMenu(mid){ state.planMenuOpen = state.planMenuOpen===mid?null:mid; state.planEntitySearch=""; render(); }
// re-render but keep the open entity menu's scroll position
function renderKeepMenuScroll(){
  const prev=document.querySelector('.entity-menu');
  const top=prev?prev.scrollTop:0;
  render();
  const next=document.querySelector('.entity-menu');
  if(next) next.scrollTop=top;
}
function setPlanEntitySearch(mid,v){ state.planEntitySearch=v; renderKeepMenuScroll();
  const inp=document.querySelector('.entity-menu .search input'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);} }
function togglePlanEntity(mid,eid){ const s=state.planSel[mid]; if(s.has(eid))s.delete(eid); else s.add(eid); renderKeepMenuScroll(); }
function togglePlanAll(mid){ const s=state.planSel[mid]; if(s.size===PLAN_ENTITIES.length)s.clear(); else PLAN_ENTITIES.forEach(e=>s.add(e.id)); renderKeepMenuScroll(); }
function togglePlanGroup(key){
  state.planGroupOpen[key] = !state.planGroupOpen[key];
  renderKeepMenuScroll();
}
function togglePlanGroupSel(mid,ids){ const s=state.planSel[mid]; const all=ids.length>0&&ids.every(i=>s.has(i)); if(all) ids.forEach(i=>s.delete(i)); else ids.forEach(i=>s.add(i)); renderKeepMenuScroll(); }
function openEntityDrawer(eid){ state.planDrawerEntity=eid; render(); }
function closeEntityDrawer(){ state.planDrawerEntity=null; render(); }
function openValidateModal(){ state.showValidateModal=true; render(); }
function closeValidateModal(){ state.showValidateModal=false; render(); }
function confirmValidate(){ state.showValidateModal=false; state.planValidated=true; render(); }

/* advanced tooltip */
let _tipEl=null;
function showTip(anchor,kind){
  hideTip();
  const t=TOOLTIPS[kind]; if(!t) return;
  const el=document.createElement('div');
  el.className='adv-tip';
  el.innerHTML=`<div class="adv-tip-title"><i class="ti ${t.icon}"></i>${t.title}</div>${t.body?`<div class="adv-tip-body">${t.body}</div>`:''}`;
  document.body.appendChild(el);
  const r=anchor.getBoundingClientRect();
  el.style.left=r.left+'px';
  el.style.top=(r.bottom+8)+'px';
  _tipEl=el;
}
function hideTip(){ if(_tipEl){ _tipEl.remove(); _tipEl=null; } }

/* ----------------- Master render ----------------- */
const TABS=[{key:"started",n:1,label:"Getting started"},{key:"survey",n:2,label:"Survey"},{key:"plan",n:3,label:"Collection plan"}];

// Collection plan is only reachable once the survey is submitted
function planUnlocked(){ return state.submitted; }
function setTab(key){
  if(key==='plan' && !planUnlocked()) return;   // locked until survey submitted
  state.openMenu=null; state.activeTab=key; render(); scrollEl.scrollTop=0;
}

function renderTabs(){
  return TABS.map((t,i)=>{
    const active=state.activeTab===t.key;
    const done = TABS.findIndex(x=>x.key===state.activeTab) > i;
    const locked = t.key==='plan' && !planUnlocked();
    if(locked){
      return `<div class="tab locked" title="Submit the survey to unlock the collection plan">
        <span class="step-dot"><i class="ti ti-lock" style="font-size:12px"></i></span>${t.label}</div>`;
    }
    return `<div class="tab ${active?'active':''} ${done?'done':''}" onclick="setTab('${t.key}')">
      <span class="step-dot">${done?'<i class="ti ti-check" style="font-size:13px"></i>':t.n}</span>${t.label}</div>`;
  }).join('');
}

function footerInner(){
  const scope=SCOPES[state.stepIndex];
  let left='', right='';

  // Selection mode: when in per-entity view with rows checked, footer becomes the bulk-select bar
  if(scope.questions){
    const q=scope.questions[state.qIndex];
    const a=state.answers[q.id];
    const n=state.selected.size;
    if(!a.bulk && n>0){
      return `<div class="foot-select">
        <span class="bulk-count"><i class="ti ti-checkbox"></i>${n} ${n===1?'entity':'entities'} selected</span>
        <div class="foot-select-actions">
          <span class="bulk-apply-lbl">Set selected to:</span>
          <button class="ans-btn" onclick="applyToSelected('${q.id}','yes')"><i class="ti ti-check"></i>Yes</button>
          <button class="ans-btn" onclick="applyToSelected('${q.id}','no')"><i class="ti ti-x"></i>No</button>
          <button class="bulk-clear" onclick="clearSelection()">Clear</button>
        </div>
      </div>`;
    }
  }

  if(scope.questions){
    const q=scope.questions[state.qIndex];
    const ans=questionAnswered(q);
    const total=ENTITIES.length;
    const pct = total? (ans/total) : 0;
    const deg = Math.round(pct*360);
    const full = ans>=total && total>0;
    const ring = full
      ? `<span class="progress-circ full"><i class="ti ti-check"></i></span>`
      : `<span class="progress-circ" style="background:conic-gradient(var(--primary) ${deg}deg, var(--grey200) ${deg}deg);"></span>`;
    left=`<div class="foot-left">${ring}<span>${ans}/${total} entities answered</span></div>`;
  }
  if(scope.key==='setup'){
    const ready = !!state.delegation;
    if(state.delegation==='delegate'){
      right=`<button class="btn btn-primary" onclick="openDelegateModal()">Confirm</button>`;
    } else {
      right=`<button class="btn ${ready?'btn-primary':'btn-disabled'}" ${ready?'onclick="advance()"':''}>Continue<i class="ti ti-chevron-right"></i></button>`;
    }
  } else if(scope.key==='summary'){
    right=`<button class="btn btn-outline" onclick="goBack()"><i class="ti ti-chevron-left"></i>Back</button>
           <button class="btn btn-primary" onclick="openSubmitModal()">Submit answers</button>`;
  } else {
    right=`<button class="btn btn-outline" onclick="goBack()"><i class="ti ti-chevron-left"></i>Back</button>
           <button class="btn btn-primary" onclick="advance()">Continue<i class="ti ti-chevron-right"></i></button>`;
  }
  return `${left}<div class="foot-right">${right}</div>`;
}

function updateFooter(){
  const f=document.querySelector('#cardFoot');
  if(f) f.innerHTML=footerInner();
}

    <div class="autosave"><i class="ti ti-circle-check"></i>Auto-save<i class="ti ti-info-circle info"></i></div>
    <div class="card ${entityMode?'card-fill':''}">
      <div class="progressbar"><div style="width:${pct}%"></div></div>
      <div class="stepper">${renderStepper()}</div>
      <div id="stepContent">${content}</div>
      <div class="card-foot" id="cardFoot">${footerInner()}</div>
    </div>
  </div>${state.showDelegateModal?renderDelegateModal():''}${state.showSubmitModal?renderSubmitModal():''}`;
}

function topnavActions(){
  if(state.activeTab==='started'){
    return `<button class="btn btn-primary" onclick="setTab('survey')">Continue<i class="ti ti-chevron-right"></i></button>`;
  }
  if(state.activeTab==='survey'){
    if(state.delegated){
      return `<button class="btn btn-outline" onclick="setTab('started')"><i class="ti ti-chevron-left"></i>Back</button>`;
    }
    if(state.submitted){
      return `<button class="btn btn-outline" onclick="setTab('started')"><i class="ti ti-chevron-left"></i>Back</button>
              <button class="btn btn-primary" onclick="setTab('plan')">Continue<i class="ti ti-chevron-right"></i></button>`;
    }
    const onSummary = SCOPES[state.stepIndex].key==='summary';
    return `<button class="btn btn-outline" onclick="setTab('started')"><i class="ti ti-chevron-left"></i>Back</button>
            <button class="btn ${onSummary?'btn-primary':'btn-disabled'}" ${onSummary?'onclick="openSubmitModal()"':''}>Submit answers</button>`;
  }
  return `<button class="btn btn-outline" onclick="setTab('survey')"><i class="ti ti-chevron-left"></i>Back</button>
          <button class="btn btn-primary" onclick="openValidateModal()">Validate</button>`;
}

function render(){
  tabsetEl.innerHTML=renderTabs();
  topnavActionsEl.innerHTML=topnavActions();
  const statusBox=document.getElementById('statusBox');
  if(statusBox){
    const done = state.delegated;
    statusBox.innerHTML = `<span class="lbl">Status:</span><span class="status-pill ${done?'done':''}">${done?'Done':'In progress'}</span>`;
  }
  if(state.activeTab==='started') contentAreaEl.innerHTML=renderGettingStarted();
  else if(state.activeTab==='survey') contentAreaEl.innerHTML=renderSurveyTab();
  else contentAreaEl.innerHTML=renderCollectionPlan();
}
render();

document.addEventListener('click',(e)=>{
  if(state.openMenu && !e.target.closest('.select-wrap')){
    state.openMenu=null; render();
  }
  if(state.planMenuOpen && !e.target.closest('.entity-select-wrap')){
    state.planMenuOpen=null; render();
  }
});
</script>
</body>
</html>
