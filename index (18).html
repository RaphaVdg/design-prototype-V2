<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Greenly — Multi-entity survey prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root{
    --primary:#26a551; --primary-hover:#1f8e45; --primary-contrast:#fff;
    --green-50:#e6f6ea; --green-400:#54c073; --green-chip:#c4e8cc;
    --text-primary:rgba(0,0,0,.87); --text-secondary:rgba(0,0,0,.6); --text-disabled:rgba(0,0,0,.38);
    --bg-default:#fafafa; --paper:#fff; --elev2:#eee; --grey200:#eee; --grey400:#bdbdbd;
    --outline:rgba(0,0,0,.08); --outline-strong:#e0e0e0;
    --info-bg:#e3f2fd; --info-border:#bbdefb; --info-text:#0d47a1;
    --indigo-bg:#c7d6ed; --indigo-text:#2a456f;
    --disabled-bg:rgba(0,0,0,.12);
    --radius-xs:4px; --radius-sm:4px; --radius-md:12px; --radius-btn:6px;
    --connector:#bdbdbd;
    /* Figma typography tokens */
    --fs-h2:24px; --lh-h2:32px; --ls-h2:-0.36px;
    --fs-body1:16px; --lh-body1:24px;
    --fs-body2:14px; --lh-body2:20px;
    --fs-caption:12px; --lh-caption:20px;
    --fs-chip:13px; --lh-chip:18px;
    --fw-regular:400; --fw-medium:500; --fw-semibold:600;
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--grey200);color:var(--text-primary);font-size:var(--fs-body2);line-height:var(--lh-body2);overflow:hidden;}
  button{font-family:inherit;cursor:pointer;}
  .tab,.step,.radio-card,.nav-item,.acct-input,.side-select,.chip-acct,.clear-x,.link-strong,.h-title i{cursor:pointer;}
  .app{display:flex;height:100vh;width:100vw;background:var(--elev2);}

  /* ---------- Sidebar ---------- */
  .sidebar{width:240px;flex-shrink:0;background:var(--elev2);display:flex;flex-direction:column;justify-content:space-between;padding:24px 16px;overflow-y:auto;}
  .logo{display:flex;align-items:center;padding-left:4px;}
  .logo img{height:24px;width:auto;display:block;}
  .logo span{color:var(--primary);}
  .acct-input{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--outline);border-radius:var(--radius-sm);padding:8px 12px;font-size:16px;width:208px;}
  .acct-input i{font-size:18px;color:var(--text-secondary);} .acct-input .caret{margin-left:auto;color:var(--text-secondary);}
  .ask{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:6px;border:none;width:100%;font-weight:600;font-size:14px;color:var(--text-primary);
       background:linear-gradient(88deg,rgba(47,206,101,.15) 27%,rgba(69,207,170,.15) 88%);}
  .ask i{font-size:18px;}
  .nav{display:flex;flex-direction:column;gap:8px;margin-top:24px;}
  .nav-item{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--text-primary);}
  .nav-item.active{background:rgba(0,0,0,.08);font-weight:500;}
  .nav-item i.lead{font-size:18px;} .nav-item .caret{margin-left:auto;font-size:14px;color:var(--text-secondary);}
  .side-foot{display:flex;flex-direction:column;gap:12px;}
  .side-select{display:flex;align-items:center;background:var(--paper);border:1px solid var(--outline);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;color:var(--text-secondary);}
  .side-select .caret{margin-left:auto;}
  .logout{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:1px solid var(--outline);border-radius:var(--radius-sm);padding:8px 16px;font-weight:600;font-size:14px;color:var(--text-primary);}

  /* ---------- Body ---------- */
  .body{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 8px 8px 0;}
  .main{flex:1;min-height:0;background:var(--bg-default);border-radius:var(--radius-md);display:flex;flex-direction:column;overflow:hidden;}
  .topnav{height:64px;flex-shrink:0;border-bottom:2px solid var(--grey200);display:flex;align-items:center;justify-content:space-between;padding:12px 24px;}
  .crumb{display:flex;align-items:center;gap:8px;font-weight:var(--fw-medium);font-size:var(--fs-body1);line-height:var(--lh-body1);}
  .crumb .muted{color:var(--text-secondary);} .crumb .sep{color:var(--text-secondary);}
  .topnav-actions{display:flex;gap:12px;}
  .btn{border-radius:var(--radius-xs);padding:8px 24px;font-weight:var(--fw-semibold);font-size:var(--fs-body1);line-height:var(--lh-body1);border:none;display:inline-flex;align-items:center;gap:8px;}
  .btn-outline{background:var(--paper);border:1px solid var(--outline);color:var(--text-primary);}
  .btn-disabled{background:var(--disabled-bg);color:var(--text-disabled);cursor:not-allowed;}
  .btn-primary{background:var(--primary);color:var(--primary-contrast);}
  .btn-primary:hover{background:var(--primary-hover);}

  .scroll{flex:1;min-height:0;overflow-y:auto;}
  .header{padding:24px 24px 0;}
  .h-title{display:flex;align-items:center;gap:8px;}
  .h-title h1{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:var(--fw-semibold);letter-spacing:var(--ls-h2);margin:0;}
  .chip-acct{display:inline-flex;align-items:center;gap:2px;background:var(--grey200);border-radius:9999px;padding:2px 8px 2px 4px;font-size:13px;}
  .chip-acct i{font-size:18px;}

  .tabs{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--outline);margin-top:16px;}
  .tabset{display:flex;}
  .tab{display:flex;align-items:center;gap:8px;padding:8px 16px 12px;font-weight:var(--fw-medium);font-size:var(--fs-body1);line-height:var(--lh-body1);color:var(--text-secondary);border-bottom:2px solid transparent;}
  .tab.active{color:var(--text-primary);border-bottom-color:var(--primary);}
  .tab.done .step-dot{background:var(--primary);}
  .step-dot{width:20px;height:20px;border-radius:9999px;background:var(--text-disabled);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .tab.active .step-dot{background:var(--primary);}
  .tab:not(.active):not(.done) .step-dot{background:var(--text-secondary);}
  .tab.locked{color:var(--text-disabled);cursor:not-allowed;}
  .tab.locked .step-dot{background:var(--text-disabled);}
  .status-box{display:flex;align-items:center;gap:6px;font-size:14px;}
  .status-box .lbl{color:#6e7072;font-weight:500;}
  .status-pill{background:var(--indigo-bg);color:var(--indigo-text);font-weight:500;border-radius:9999px;padding:3px 10px;font-size:14px;}
  .status-pill.done{background:var(--green-chip);color:#0f6e2e;}

  .content-area{padding:24px;display:flex;flex-direction:column;align-items:center;}

  /* Getting started tab */
  .gs-wrap{width:100%;max-width:1055px;display:flex;flex-direction:column;gap:24px;}
  .hero-card{display:flex;gap:32px;align-items:stretch;background:var(--paper);border:1px solid var(--outline-strong);border-radius:10px;padding:16px;min-height:220px;}
  .hero-text{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:16px;}
  .hero-title{font-size:20px;line-height:24px;font-weight:var(--fw-semibold);letter-spacing:-.2px;margin:0 0 8px;}
  .hero-body{font-size:var(--fs-body1);line-height:var(--lh-body1);margin:0;color:var(--text-primary);}
  .link-strong{font-size:var(--fs-body2);line-height:var(--lh-body2);font-weight:var(--fw-semibold);color:var(--text-primary);text-decoration:underline;cursor:pointer;align-self:flex-start;}
  .hero-img{flex:1;min-width:0;display:flex;align-items:center;}
  .hero-img img{display:block;width:100%;height:auto;}

  .gs-cols{display:flex;gap:24px;align-items:flex-start;}
  .gs-card{flex:1;min-width:0;background:var(--paper);border:1px solid var(--outline);border-radius:10px;padding:32px;display:flex;flex-direction:column;gap:24px;}
  .gs-h{font-size:20px;line-height:24px;font-weight:var(--fw-semibold);letter-spacing:-.2px;margin:0;display:flex;}
  .gs-step{display:flex;flex-direction:column;gap:2px;}
  .gs-step-title{font-size:var(--fs-body1);line-height:var(--lh-body1);font-weight:var(--fw-medium);}
  .gs-step-body{font-size:var(--fs-body1);line-height:var(--lh-body1);color:var(--text-secondary);padding-left:20px;}
  .faq-list{display:flex;flex-direction:column;gap:12px;}
  .faq{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-default,#fafafa);border:1px solid var(--outline);border-radius:6px;padding:12px 16px;text-align:left;width:100%;}
  .faq-q{font-size:var(--fs-body1);line-height:var(--lh-body1);font-weight:var(--fw-medium);color:var(--text-primary);}
  .faq-chev{font-size:20px;color:var(--text-secondary);transition:transform .2s;flex-shrink:0;}
  .faq-a{font-size:var(--fs-body2);line-height:var(--lh-body2);color:var(--text-secondary);max-height:0;overflow:hidden;padding:0 16px;transition:max-height .2s,padding .2s;}
  .faq-a.open{max-height:200px;padding:8px 16px 12px;}
  .survey-wrap{width:100%;max-width:1055px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .autosave{display:flex;align-items:center;gap:4px;font-size:14px;}
  .autosave i{font-size:18px;color:var(--primary);} .autosave .info{font-size:14px;color:var(--text-secondary);}
  .card{width:100%;background:var(--paper);border:1px solid var(--outline);border-radius:var(--radius-md);overflow:hidden;}
  .progressbar{height:4px;background:var(--grey200);}
  .progressbar > div{height:100%;background:var(--primary);transition:width .3s ease;}

  /* Stepper */
  .stepper{display:flex;align-items:center;gap:8px;padding:32px 24px 0;}
  .step{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .step .num{width:24px;height:24px;border-radius:9999px;background:var(--text-disabled);color:#fff;font-size:var(--fs-caption);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step.active .num,.step.done .num{background:var(--primary);}
  .step .stxt{font-size:var(--fs-body2);line-height:var(--lh-body2);color:var(--text-secondary);white-space:nowrap;}
  .step.active .stxt{color:var(--text-primary);font-weight:500;}
  .step .scount{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-primary);}
  .connector{flex:1;height:1px;background:var(--connector);min-width:16px;}

  .panel{padding:32px 24px 24px;display:flex;flex-direction:column;gap:24px;}
  .panel h2{font-size:var(--fs-body1);line-height:var(--lh-body1);font-weight:var(--fw-semibold);margin:0;}
  .alert{display:flex;align-items:flex-start;gap:8px;background:var(--info-bg);border:1px solid var(--info-border);border-radius:var(--radius-xs);padding:8px 16px;color:var(--info-text);font-size:var(--fs-body2);line-height:var(--lh-body2);}
  .alert i.lead{font-size:20px;flex-shrink:0;margin-top:8px;} .alert .txt{padding:8px 0;flex:1;} .alert b{font-weight:500;}
  .alert .close{margin-left:auto;background:none;border:none;color:var(--info-text);font-size:18px;padding:5px;border-radius:9999px;opacity:.7;}

  /* Radio cards */
  .radio-card{display:flex;align-items:center;gap:8px;height:54px;padding:8px 12px;border:1px solid var(--outline-strong);border-radius:var(--radius-btn);background:var(--paper);width:420px;}
  .radio-card.sel{background:var(--green-50);border-color:var(--green-400);}
  .radio-card .lbl{font-size:var(--fs-body2);line-height:var(--lh-body2);}
  .radio-card .chip{background:var(--green-chip);color:#0f6e2e;border-radius:9999px;padding:2px 10px;font-size:13px;}
  .radio-card .radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--text-secondary);position:relative;flex-shrink:0;}
  .radio-card.sel .radio{border-color:var(--primary);}
  .radio-card.sel .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary);}
  .accordion{display:flex;align-items:center;font-weight:var(--fw-medium);font-size:var(--fs-body1);line-height:var(--lh-body1);background:none;border:none;padding:8px 0;color:var(--text-primary);}
  .accordion i{font-size:24px;}
  .prev-table-wrap{border:1px solid var(--outline);border-radius:8px;overflow:hidden;}
  .prev-table{width:100%;border-collapse:collapse;font-size:var(--fs-body2);line-height:var(--lh-body2);}
  .prev-table th{text-align:left;font-weight:var(--fw-medium);color:var(--text-primary);padding:14px 16px;background:#fafafa;border-bottom:1px solid var(--outline);}
  .prev-group td{background:#fafafa;color:var(--text-secondary);font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:var(--fw-medium);letter-spacing:.5px;padding:8px 16px;border-bottom:1px solid var(--outline);text-transform:uppercase;}
  .prev-row td{padding:14px 16px;border-bottom:1px solid var(--outline);vertical-align:top;}
  .prev-chip{display:inline-block;background:var(--grey200);color:var(--text-primary);border-radius:9999px;padding:4px 12px;font-size:var(--fs-chip);line-height:var(--lh-chip);}
  .prev-q{color:var(--text-primary);}
  .prev-showall{text-align:center;padding:0;background:#fafafa;}
  .prev-showall button{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:14px 16px;font-size:var(--fs-body1);line-height:var(--lh-body1);font-weight:var(--fw-medium);color:var(--text-primary);}
  .prev-showall button i{font-size:18px;}

  /* Summary review table */
  .sum-table-wrap{display:flex;flex-direction:column;}
  .sum-toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 16px;}
  .icon-btn{background:none;border:none;color:var(--text-secondary);padding:6px;border-radius:6px;display:inline-flex;align-items:center;}
  .icon-btn:hover{background:#f5f5f5;}
  .icon-btn i{font-size:20px;}
  .sum-table{border:1px solid var(--outline);border-radius:8px;overflow:hidden;}
  .sum-group td{background:#fafafa;color:var(--text-secondary);font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:var(--fw-medium);letter-spacing:.5px;padding:8px 16px;border-bottom:1px solid var(--outline);text-transform:uppercase;}
  .sum-row td{padding:14px 16px;border-bottom:1px solid var(--outline);vertical-align:top;}
  .sum-table tbody tr:last-child td{border-bottom:none;}
  .sum-q{color:var(--text-primary);max-width:520px;}
  .count-chip{display:inline-flex;align-items:center;gap:4px;background:var(--grey200);color:var(--text-primary);border-radius:6px;padding:4px 10px;font-size:var(--fs-body2);}
  .count-chip i{font-size:15px;color:var(--text-secondary);}
  .sum-edit{text-align:right;}
  .edit-link{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--text-primary);font-size:var(--fs-body2);font-weight:var(--fw-medium);text-decoration:underline;}
  .edit-link i{font-size:16px;text-decoration:none;}
  .sum-pagination{display:flex;align-items:center;justify-content:flex-end;gap:24px;padding:16px 4px 0;font-size:var(--fs-body2);color:var(--text-secondary);}
  .sum-pagination .pag-arrows{display:flex;gap:4px;}

  .card-foot{border-top:1px solid var(--outline);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;}
  .foot-select{flex:1;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--green-50);border:1px solid var(--green-400);border-radius:8px;padding:8px 16px;}
  .foot-select .bulk-count{color:#0f6e2e;font-weight:var(--fw-medium);}
  .foot-select-actions{display:flex;align-items:center;gap:8px;}
  .foot-select .ans-btn{border-radius:6px;border:1px solid var(--outline-strong);background:var(--paper);}
  .foot-left{display:flex;align-items:center;gap:12px;font-size:var(--fs-body2);line-height:var(--lh-body2);color:var(--text-primary);}
  .foot-right{display:flex;gap:16px;margin-left:auto;}
  .progress-circ{width:28px;height:28px;border-radius:50%;display:inline-block;position:relative;flex-shrink:0;box-sizing:border-box;}
  .progress-circ::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--paper);}
  .progress-circ.full{background:var(--primary);display:flex;align-items:center;justify-content:center;}
  .progress-circ.full::after{display:none;}
  .progress-circ.full i{color:#fff;font-size:16px;}

  /* ---------- Question step ---------- */
  .q-block{display:flex;flex-direction:column;gap:24px;}
  .q-head{display:flex;flex-direction:column;gap:16px;}
  .q-text{font-size:var(--fs-body1);line-height:var(--lh-body1);font-weight:var(--fw-semibold);max-width:900px;}
  .scope-chip{align-self:flex-start;background:var(--grey200);color:var(--text-primary);border-radius:9999px;padding:4px 12px;font-size:var(--fs-chip);line-height:var(--lh-chip);}
  .scope-chip-trunc{display:inline-block;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;cursor:default;}

  .bulk-callout{display:flex;align-items:center;gap:12px;background:#f5f5f5;border-radius:8px;padding:16px;}
  .bulk-callout > i{font-size:22px;color:var(--text-secondary);flex-shrink:0;}
  .bulk-txt{display:flex;flex-direction:column;gap:2px;}
  .bulk-txt .lbl{font-size:var(--fs-body1);line-height:var(--lh-body1);font-weight:var(--fw-semibold);}
  .bulk-txt .hint{font-size:var(--fs-body2);line-height:var(--lh-body2);color:var(--text-secondary);}
  .bulk-toggle{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .bulk-label{font-size:var(--fs-body1);line-height:var(--lh-body1);font-weight:var(--fw-medium);}
  .switch{width:40px;height:22px;border-radius:9999px;background:var(--grey400);position:relative;border:none;flex-shrink:0;transition:background .2s;}
  .switch.on{background:var(--primary);}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;}
  .switch.on::after{left:20px;}

  .yesno-stack{display:flex;flex-direction:column;gap:12px;max-width:540px;}
  .answer-card{display:flex;align-items:center;gap:12px;height:56px;padding:8px 16px;border:1px solid var(--outline-strong);border-radius:8px;background:var(--paper);text-align:left;}
  .answer-card.sel{background:var(--green-50);border-color:var(--green-400);}
  .answer-icon{font-size:20px;color:var(--text-secondary);}
  .answer-card.sel .answer-icon{color:#0f6e2e;}
  .answer-lbl{font-size:var(--fs-body2);line-height:var(--lh-body2);}
  .answer-card .radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--text-secondary);position:relative;flex-shrink:0;}
  .answer-card .radio.on{border-color:var(--primary);}
  .answer-card .radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary);}

  /* Per-entity DataGrid */
  .datagrid{display:flex;flex-direction:column;gap:16px;}
  .grid-sticky{display:flex;flex-direction:column;gap:16px;}
  .grid-scroll{overflow:visible;}

  /* Bounded-height card so footer pins and table scrolls (per-entity mode) */
  .survey-wrap.wrap-fill{flex:1;min-height:0;}
  .card-fill{display:flex;flex-direction:column;max-height:calc(100vh - 96px);min-height:0;position:sticky;top:8px;}
  .card-fill #stepContent{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .card-fill .panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .card-fill .q-block{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;gap:24px;}
  .card-fill .datagrid{flex:1;min-height:0;overflow:hidden;}
  .card-fill .grid-scroll{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--outline);border-radius:8px;}
  .card-fill .grid-scroll .ent-table{border:none;border-radius:0;}
  .card-fill .grid-scroll thead th{position:sticky;top:0;z-index:2;}
  .card-fill .card-foot{flex-shrink:0;}
  .grid-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--outline-strong);border-radius:var(--radius-btn);padding:8px 14px;width:240px;background:var(--paper);height:44px;}
  .search i{font-size:18px;color:var(--text-secondary);}
  .search input{border:none;outline:none;font-family:inherit;font-size:var(--fs-body2);line-height:var(--lh-body2);flex:1;background:transparent;color:var(--text-primary);}
  .search input::placeholder{color:var(--text-secondary);}
  .select-wrap{position:relative;}
  .select-box{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--outline-strong);border-radius:var(--radius-btn);padding:8px 14px;font-size:var(--fs-body2);line-height:var(--lh-body2);color:var(--text-secondary);background:var(--paper);width:200px;height:44px;cursor:pointer;}
  .select-box.active{border-color:var(--primary);color:var(--text-primary);font-weight:500;background:var(--green-50);}
  .select-box i{font-size:18px;}
  .select-box .clear-x{color:var(--text-secondary);}
  .filter-menu{position:absolute;top:48px;left:0;z-index:20;background:var(--paper);border:1px solid var(--outline);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:200px;max-height:280px;overflow-y:auto;padding:4px;}
  .filter-opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:none;padding:10px 12px;font-size:14px;color:var(--text-primary);border-radius:6px;}
  .filter-opt:hover{background:#f5f5f5;}
  .filter-opt.sel{color:var(--primary);font-weight:500;}
  .filter-opt i{font-size:16px;color:var(--primary);}
  .clear-filters{background:none;border:none;color:var(--primary);font-size:14px;font-weight:500;text-decoration:underline;padding:8px;}
  .result-meta{font-size:13px;color:var(--text-secondary);}
  .no-results{text-align:center;color:var(--text-secondary);padding:32px 12px;font-size:var(--fs-body2);line-height:var(--lh-body2);}

  .ent-table{width:100%;border-collapse:collapse;font-size:var(--fs-body2);line-height:var(--lh-body2);border:1px solid var(--outline);border-radius:8px;overflow:hidden;}
  .ent-table th{text-align:left;font-weight:var(--fw-medium);color:var(--text-primary);font-size:var(--fs-body2);line-height:var(--lh-body2);padding:14px 16px;border-bottom:1px solid var(--outline);background:#fafafa;}
  .ent-table td{padding:14px 16px;border-bottom:1px solid var(--outline);vertical-align:middle;}
  .ent-table tbody tr:last-child td{border-bottom:none;}
  .cb-cell{width:48px;}
  .cbox{width:20px;height:20px;border:1.5px solid var(--grey400);border-radius:4px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:#fff;padding:0;}
  .cbox.on{background:var(--primary);border-color:var(--primary);}
  .cbox i{font-size:14px;}
  .ent-placeholder{display:inline-flex;align-items:center;gap:8px;background:#ededed;color:var(--text-secondary);border-radius:6px;padding:6px 12px;font-size:var(--fs-body2);line-height:var(--lh-body2);}
  .ent-placeholder i{font-size:16px;}
  .cell-muted{color:var(--text-secondary);}
  .answer-cell{display:flex;gap:0;justify-content:flex-end;}
  .ans-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--paper);border:1px solid var(--outline-strong);font-size:var(--fs-body2);line-height:var(--lh-body2);color:var(--text-primary);}
  .ans-btn:first-child{border-radius:6px 0 0 6px;border-right:none;}
  .ans-btn:last-child{border-radius:0 6px 6px 0;}
  .ans-btn i{font-size:16px;color:var(--text-secondary);}
  .ans-btn.ans-yes{background:var(--green-50);border-color:var(--green-400);color:#0f6e2e;font-weight:500;z-index:1;}
  .ans-btn.ans-yes i{color:#0f6e2e;}
  .ans-btn.ans-no{background:#fdecea;border-color:#e69995;color:#b3261e;font-weight:500;z-index:1;}
  .ans-btn.ans-no i{color:#b3261e;}

  /* Bulk selection action bar */
  .bulk-count{display:flex;align-items:center;gap:8px;font-size:var(--fs-body2);line-height:var(--lh-body2);font-weight:var(--fw-medium);color:#0f6e2e;}
  .bulk-count i{font-size:18px;}
  .bulk-actions{display:flex;align-items:center;gap:8px;}
  .bulk-apply-lbl{font-size:var(--fs-body2);line-height:var(--lh-body2);color:var(--text-secondary);margin-right:4px;}
  .bulk-clear{background:none;border:none;color:var(--text-secondary);font-size:14px;text-decoration:underline;padding:8px;}

  .placeholder-note{font-size:13px;color:var(--text-disabled);font-style:italic;}
  .hidden{display:none!important;}

  /* ===== Collection plan tab ===== */
  .plan-wrap{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:24px;}
  .info-banner{display:flex;align-items:center;gap:8px;background:var(--info-bg);border:1px solid var(--info-border);border-radius:var(--radius-xs);padding:12px 16px;color:var(--info-text);font-size:var(--fs-body2);line-height:var(--lh-body2);}
  .info-banner i{font-size:20px;flex-shrink:0;}
  .info-banner b{font-weight:var(--fw-semibold);}
  .info-x{margin-left:auto;background:none;border:none;color:var(--info-text);font-size:18px;padding:4px;}
  .plan-metrics{display:flex;gap:24px;}
  .metric-card{flex:1;background:var(--paper);border:1px solid var(--outline);border-radius:10px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;}
  .metric-head{display:flex;align-items:center;gap:8px;font-size:var(--fs-body2);color:var(--text-primary);font-weight:var(--fw-medium);}
  .metric-head i{font-size:18px;color:var(--text-secondary);}
  .metric-i{margin-left:auto;}
  .metric-num{font-size:32px;font-weight:var(--fw-semibold);line-height:1.1;}
  .metric-den{font-size:16px;color:var(--text-secondary);font-weight:400;}
  .metric-foot{font-size:var(--fs-body2);color:var(--text-secondary);border-top:1px solid var(--outline);padding-top:8px;}
  .metric-warn{display:inline-flex;align-items:center;gap:6px;background:#fdf0e3;color:#b76e00;border-radius:6px;padding:4px 10px;font-size:13px;}
  .metric-ok{display:inline-flex;align-items:center;gap:6px;color:#0f6e2e;}
  .metric-warn i,.metric-ok i{font-size:15px;}

  .plan-card{background:var(--paper);border:1px solid var(--outline);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:24px;}
  .plan-toggle{display:inline-flex;background:#f0f0f0;border-radius:8px;padding:3px;align-self:flex-start;}
  .plan-toggle button{border:none;background:none;padding:8px 16px;border-radius:6px;font-size:var(--fs-body2);font-weight:var(--fw-medium);color:var(--text-secondary);}
  .plan-toggle button.on{background:var(--paper);color:var(--text-primary);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .plan-body{display:flex;flex-direction:column;gap:32px;}
  .scope-block{display:flex;flex-direction:column;gap:12px;}
  .scope-h{font-size:var(--fs-body1);font-weight:var(--fw-semibold);margin:0;}
  .plan-table{width:100%;border-collapse:collapse;font-size:var(--fs-body2);table-layout:fixed;}
  .plan-table th{text-align:left;font-weight:var(--fw-medium);color:var(--text-secondary);padding:12px 8px;border-bottom:1px solid var(--outline);}
  .plan-table td{padding:14px 8px;vertical-align:middle;}
  .plan-table tbody tr{border-bottom:1px solid var(--outline);transition:background .12s;}
  .plan-table tbody tr:last-child{border-bottom:none;}
  .mod-name{display:inline-flex;align-items:center;gap:10px;font-weight:var(--fw-medium);color:var(--text-primary);}
  .mod-name-link{cursor:pointer;}
  .plan-table tbody tr:hover{background:rgba(0,0,0,0.04);}
  .plan-table tbody tr:hover .mod-label{text-decoration:underline;text-underline-position:from-font;}
  .mod-name i{font-size:20px;color:var(--text-secondary);}
  .mod-icon-tile{display:inline-flex;align-items:center;justify-content:center;background:var(--paper-1,#f5f5f5);border-radius:4px;padding:4px;flex:none;}
  .mod-icon-tile i{font-size:22px;color:var(--text-secondary);}
  .prio{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:var(--fs-chip);cursor:default;}
  .prio i{font-size:14px;}
  .prio-mandatory{background:var(--grey200);color:var(--text-primary);}
  .prio-high{background:#fde7d9;color:#b85c1a;}
  .prio-medium{background:#fdf3d4;color:#9a7b1a;}

  .entity-cell{overflow:visible;}
  .entity-select-wrap{position:relative;}
  .entity-select{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--outline-strong);border-radius:var(--radius-btn);padding:8px 14px;font-size:var(--fs-body2);color:var(--text-secondary);background:var(--paper);cursor:pointer;}
  .entity-select.has{color:var(--text-primary);}
  .entity-select.locked{background:var(--grey200);color:var(--text-secondary);cursor:not-allowed;}
  .entity-select i{font-size:18px;}
  .sel-chip{display:inline-flex;align-items:center;background:var(--grey200,#eee);color:var(--text-primary);border-radius:9999px;padding:2px 10px;font-size:var(--fs-body2);line-height:20px;white-space:nowrap;}
  .entity-menu{position:absolute;top:46px;left:0;right:0;z-index:30;background:var(--paper);border:1px solid var(--outline);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:300px;overflow-y:auto;padding:4px;}
  .ent-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:10px 12px;font-size:var(--fs-body2);color:var(--text-primary);border-radius:6px;}
  .ent-opt:hover{background:#f5f5f5;}
  .ent-opt .cbox{width:18px;height:18px;border:1.5px solid var(--grey400);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .ent-opt .cbox.on{background:var(--primary);border-color:var(--primary);}
  .ent-opt .cbox i{font-size:13px;}
  .ent-group{display:flex;flex-direction:column;}
  .ent-group-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;padding:10px 12px;font-size:var(--fs-body2);font-weight:var(--fw-medium);color:var(--text-primary);border-radius:6px;}
  .ent-group-h:hover{background:#f5f5f5;}
  .ent-group-h.disabled{color:var(--text-disabled);cursor:not-allowed;}
  .ent-group-h.disabled:hover{background:none;}
  .ent-group-h.disabled .cbox{border-color:var(--outline-strong);background:#f5f5f5;}
  .ent-group-h .grp-caret{font-size:16px;color:var(--text-secondary);}
  .ent-group-h .cbox{width:18px;height:18px;border:1.5px solid var(--grey400);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .ent-group-h .cbox.on{background:var(--primary);border-color:var(--primary);}
  .ent-opt.indent{padding-left:46px;}

  .summary-table .ta-center,.plan-table .ta-center{text-align:center;}
  .th-sub{font-weight:400;font-size:12px;color:var(--text-disabled);}
  .sum-entity-row{cursor:pointer;}
  .sum-entity-row:hover{background:#fafafa;}
  .ent-name-cell{display:inline-flex;align-items:center;gap:10px;font-weight:var(--fw-medium);}
  .ent-name-cell i{font-size:18px;color:var(--text-secondary);}
  .extra-chip{display:inline-flex;align-items:center;gap:6px;color:var(--text-primary);font-size:var(--fs-body2);}
  .extra-chip i{font-size:16px;color:var(--text-secondary);}
  .plan-status{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:13px;}
  .plan-status.warn{background:#fdf0e3;color:#b76e00;}
  .plan-status.ok{background:var(--green-50);color:#0f6e2e;}
  .plan-status i{font-size:14px;}

  .plan-help{background:var(--paper-1,#f5f5f5);border:none;border-radius:var(--radius-sm,4px);padding:16px;display:flex;flex-direction:column;gap:16px;}
  .plan-help-text{display:flex;flex-direction:column;gap:4px;}
  .plan-help-h{font-size:var(--fs-body1);font-weight:var(--fw-medium);margin:0;}
  .plan-help-b{font-size:var(--fs-body2);color:var(--text-secondary);margin:0;}
  .plan-help-actions{display:flex;gap:12px;}
  .plan-help-actions .btn{font-size:var(--fs-body2);font-weight:var(--fw-medium);padding:4px 8px;}

  .modal-metrics{gap:12px;}
  .modal-metrics .metric-card{padding:14px 16px;gap:4px;}
  .modal-metrics .metric-num{font-size:24px;}
  .validate-status{display:flex;align-items:flex-start;gap:12px;border-radius:8px;padding:14px 16px;}
  .validate-status.ok{background:var(--green-50);}
  .validate-status.warn{background:#fdf0e3;}
  .validate-status i{font-size:22px;flex-shrink:0;}
  .validate-status.ok i{color:#0f6e2e;}
  .validate-status.warn i{color:#b76e00;}
  .vs-title{font-weight:var(--fw-semibold);font-size:var(--fs-body2);}
  .validate-status.ok .vs-title{color:#0f6e2e;}
  .validate-status.warn .vs-title{color:#b76e00;}
  .vs-body{font-size:var(--fs-body2);color:var(--text-secondary);}

  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:flex;justify-content:flex-end;}
  .drawer{width:440px;max-width:90vw;background:var(--paper);height:100%;padding:24px;display:flex;flex-direction:column;gap:24px;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.15);}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;}
  .drawer-title{display:flex;align-items:center;gap:8px;font-size:var(--fs-h2);font-weight:var(--fw-semibold);letter-spacing:var(--ls-h2);}
  .drawer-title i{font-size:24px;color:var(--text-secondary);}
  .drawer-sub{font-size:var(--fs-body2);color:var(--text-secondary);margin-top:4px;}
  .drawer-section{display:flex;flex-direction:column;gap:8px;}
  .drawer-section-h{display:flex;align-items:center;gap:8px;font-size:var(--fs-body1);font-weight:var(--fw-semibold);}
  .drawer-section-h.ok{color:#0f6e2e;} .drawer-section-h.warn{color:#b76e00;}
  .drawer-section-h i{font-size:18px;}
  .drawer-note{font-size:var(--fs-body2);color:var(--text-secondary);margin:0;}
  .drawer-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:var(--fs-body2);color:var(--text-primary);}
  .drawer-modtype{display:flex;align-items:center;gap:6px;font-size:var(--fs-body2);color:var(--text-secondary);margin-top:6px;}
  .drawer-modtype i{font-size:15px;}
  .mod-sec-h{font-size:var(--fs-body1);font-weight:var(--fw-semibold);margin-bottom:8px;}
  .mod-sec-p{font-size:var(--fs-body1);line-height:var(--lh-body1);color:var(--text-primary);margin:0;}
  .scope-chips{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
  .beges-chip{border:1px solid var(--outline-strong);border-radius:9999px;padding:6px 14px;font-size:var(--fs-body2);color:var(--text-primary);}
  .mod-defined{font-size:var(--fs-body2);color:var(--text-secondary);margin:12px 0 0;}

  .adv-tip{position:fixed;z-index:200;background:var(--paper);border:1px solid var(--outline);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:14px 16px;max-width:320px;pointer-events:none;}
  .adv-tip-title{display:flex;align-items:center;gap:8px;font-size:var(--fs-body1);font-weight:var(--fw-semibold);}
  .adv-tip-title i{font-size:18px;}
  .adv-tip-body{font-size:var(--fs-body2);color:var(--text-secondary);margin-top:6px;}

  /* Delegate modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:var(--paper);border-radius:12px;width:640px;max-width:calc(100vw - 48px);padding:24px;box-shadow:0 12px 48px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:20px;}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .modal-title{font-size:var(--fs-h2);line-height:var(--lh-h2);letter-spacing:var(--ls-h2);font-weight:var(--fw-semibold);margin:0;}
  .modal-sub{font-size:var(--fs-body1);line-height:var(--lh-body1);color:var(--text-secondary);margin:4px 0 0;}
  .modal-x{background:none;border:none;font-size:22px;color:var(--text-secondary);padding:4px;border-radius:9999px;display:flex;}
  .modal-info{display:flex;align-items:flex-start;gap:8px;background:var(--info-bg);border:1px solid var(--info-border);border-radius:var(--radius-xs);padding:12px 16px;color:var(--info-text);font-size:var(--fs-body2);line-height:var(--lh-body2);}
  .modal-info i{font-size:20px;flex-shrink:0;}
  .modal-body{font-size:var(--fs-body1);line-height:var(--lh-body1);color:var(--text-primary);margin:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:12px;}

  /* Delegated success */
  .delegated-check{width:64px;height:64px;border-radius:50%;background:var(--green-50);display:flex;align-items:center;justify-content:center;}
  .delegated-check i{font-size:32px;color:var(--primary);}
  .link-inline{color:var(--info-text);text-decoration:underline;cursor:pointer;font-weight:500;}
</style>
</head>

          <div class="h-title">
            <h1>Emission sources and data collection plan</h1>
            <i class="ti ti-chevron-down" style="font-size:24px;color:var(--text-secondary)"></i>
            <span class="chip-acct"><i class="ti ti-world"></i>Acme group</span>

</div>

<script>
/* ----------------- Data model ----------------- */
const COUNTRIES = [
  {country:"France",flag:"🇫🇷"},{country:"Germany",flag:"🇩🇪"},{country:"Spain",flag:"🇪🇸"},
  {country:"United Kingdom",flag:"🇬🇧"},{country:"Italy",flag:"🇮🇹"},{country:"Netherlands",flag:"🇳🇱"},
  {country:"Switzerland",flag:"🇨🇭"},{country:"Sweden",flag:"🇸🇪"},{country:"Belgium",flag:"🇧🇪"},
  {country:"Poland",flag:"🇵🇱"},{country:"Portugal",flag:"🇵🇹"},{country:"Denmark",flag:"🇩🇰"},
];
const INDUSTRIES = ["Technology","Manufacturing","Transport and logistics","Retail","Food and beverage","Energy","Pharmaceuticals","Construction","Professional services"];
const SUFFIXES = {France:"SAS",Germany:"GmbH",Spain:"S.L.","United Kingdom":"Ltd",Italy:"S.r.l.",Netherlands:"BV",Switzerland:"AG",Sweden:"AB",Belgium:"SA",Poland:"Sp. z o.o.",Portugal:"Lda",Denmark:"ApS"};
const UNITS = ["Manufacturing","Logistics","Retail","Tech Solutions","Foods","Energy","Pharma","Construction","Services","Digital","Textiles","Operations","Trading","Mobility","Materials","Systems"];
const ENTITIES = (()=>{
  const out=[]; let ci=0,ui=0,ii=0;
  for(let i=0;i<20;i++){
    const c=COUNTRIES[ci%COUNTRIES.length];
    const unit=UNITS[ui%UNITS.length];
    out.push({
      name:"Acme "+unit+" "+(SUFFIXES[c.country]||""),
      country:c.country, flag:c.flag, industry:INDUSTRIES[ii%INDUSTRIES.length]
    });
    ci++;ui++;ii++;
  }
  return out;
})();

/* Scopes (steps). Real copy where provided; placeholders elsewhere. */
const SCOPES = [
  { key:"setup", label:"Set up" },
  { key:"direct", label:"Direct emissions", questions:[
      { id:"d1", text:"Do any of your entities carry out manufacturing or industrial processes that directly release greenhouse gases into the atmosphere?", chip:"Scope 1.3 - Process emissions", real:true },
  ]},
  { key:"downstream", label:"Indirect downstream", questions:[
      { id:"ds1", text:"Do any of your entities sell products or services that consume fossil fuels or electricity, or that directly release greenhouse gases when used?", chip:"Scope 3.11 - Use of product sold", real:true },
      { id:"ds2", text:"Do any of your entities sell products that need to be disposed of at the end of their lifetime?", chip:"Scope 3.12 - End-of-life treatment of sold products", real:true },
  ]},
  { key:"upstream", label:"Indirect upstream", questions:[
      { id:"us1", text:"Do any of your entities have employees who undertake business travel as part of their job?", chip:"Scope 3.6 - Business travel", real:true },
      { id:"us2", text:"Do any of your entities own vehicles or hold long-term vehicle leases?", chip:"Scope 1.2 - Transportation of materials, products, waste, and employees", real:true },
  ]},
  { key:"summary", label:"Summary" },
];

/* ----------------- Collection plan data ----------------- */
// 20 entities for the collection plan (country-appropriate legal suffixes)
const PLAN_ENTITIES = (()=>{
  const C=[["France","SAS"],["Germany","GmbH"],["Spain","S.L."],["United Kingdom","Ltd"],["Italy","S.r.l."],["Netherlands","BV"],["Sweden","AB"],["Belgium","SA"],["Poland","Sp. z o.o."],["Portugal","Lda"]];
  const U=["Manufacturing","Logistics","Retail","Tech Solutions","Foods","Energy","Pharma","Construction","Services","Digital","Textiles","Operations","Trading","Mobility","Materials","Systems","Group","Holding","Distribution","Ventures"];
  const out=[];
  for(let i=0;i<20;i++){ const c=C[i%C.length]; out.push({id:"e"+(i+1), name:"Acme "+U[i]+" "+c[1]}); }
  return out;
})();
const PRIORITY = {
  mandatory:{label:"Mandatory", cls:"prio-mandatory", locked:true},
  high:{label:"High", cls:"prio-high"},
  medium:{label:"Medium", cls:"prio-medium"},
};
const TOOLTIPS = {
  mandatory:{icon:"ti-lock", title:"Mandatory for scope 3 emissions tracking", body:"Provide an estimation of most emissions sources from your spend data."},
  high:{icon:"ti-target", title:"Essential for a complete report", body:"Captures emissions your spend data misses, so your report stays complete."},
  medium:{icon:"ti-ruler-measure", title:"Increase accuracy of your report", body:"Replaces spend-based estimates with precise activity data for a more accurate report."},
};
const ALL_IDS = PLAN_ENTITIES.map(e=>e.id);
const PACKAGE_SIZE = 7;   // modules included per entity in the package; anything beyond is "extra"
// 'relevant' = entity ids for whom the module is considered at its tier priority.
// If relevant covers all entities, the dropdown shows no "Other" split.
const _most = ALL_IDS.slice(0, 16);   // most entities (a few in "Other")
const _all = ALL_IDS.slice();          // every entity (no split)
const PLAN_MODULES = {
  "Scope 1 & 2":[
    {id:"m_fuel", name:"Fuel consumption", icon:"ti-gas-station", prio:"mandatory"},
    {id:"m_build", name:"Buildings", icon:"ti-building", prio:"mandatory"},
  ],
  "Scope 3":[
    {id:"m_fin", name:"Financial transactions", icon:"ti-receipt", prio:"mandatory"},
    {id:"m_emp", name:"Employee survey", icon:"ti-users", prio:"high", relevant:_most},
    {id:"m_dfreight", name:"Downstream freight", icon:"ti-ship", prio:"high", relevant:_all},   // fully high → no split
    {id:"m_visit", name:"Visitors & clients transport", icon:"ti-armchair", prio:"high", relevant:_most},
    {id:"m_travel", name:"Business travels", icon:"ti-luggage", prio:"medium", relevant:_most},
    {id:"m_it", name:"IT Inventory", icon:"ti-device-desktop", prio:"medium", relevant:_all},   // fully medium → no split
    {id:"m_cons", name:"Consultants & Contractors", icon:"ti-arrows-exchange", prio:"medium", relevant:_most},
    {id:"m_fleet", name:"Vehicle fleet", icon:"ti-car", prio:"medium", relevant:_most},
    {id:"m_cloud", name:"Cloud", icon:"ti-cloud", prio:"medium", relevant:_most},
    {id:"m_ads", name:"Digital Ads", icon:"ti-ad-circle", prio:"medium", relevant:_most},
  ],
};
const state = {
  activeTab: "started",    // "started" | "survey" | "plan"
  stepIndex: 0,            // index into SCOPES
  qIndex: 0,               // index of current question within the scope
  delegation: null,        // null | "answer" | "delegate"
  answers: {},
  selected: new Set(),
  filters: { search:"", country:"", industry:"", answer:"" },
  openMenu: null,
  previewOpen: false,
  previewShowAll: false,
  showDelegateModal: false,
  delegated: false,
  showSubmitModal: false,
  submitted: false,
  planView: "plan",          // "plan" | "summary"
  planSel: {},               // moduleId -> Set of entity ids
  planMenuOpen: null,        // moduleId whose entity menu is open
  planGroupOpen: {},         // groupKey -> expanded bool
  planEntitySearch: "",
  planDrawerEntity: null,    // entity id for summary drawer
  planDrawerModule: null,    // module id for module-info drawer
  showValidateModal: false,
  planValidated: false,
};
// Module detail content for the info drawer (type, about, data collected, BEGES scope chips)
const MODULE_DETAILS = {
  m_fuel:{type:"Activity-based module", about:"This module calculates emissions from fuel consumed in mobile sources operated by the company.", data:["Fuel type (e.g., diesel, petrol, electricity)","Quantity (e.g., kg, L, kWh) or distance (e.g., km, miles, tonne-km, passenger-km)"], scopes:["1.2 Direct emissions from mobile combustion sources","2.1 Indirect emissions from electricity consumption","4.1 Purchases of goods"]},
  m_build:{type:"Activity-based module", about:"This module calculates emissions from buildings, including electricity, heating, air conditioning leaks, and employee waste.", data:["Actual consumption (kWh, L)","Surface area (m²)","Number of employees"], scopes:["1.1 Direct emissions from stationary combustion sources","1.4 Direct fugitive emissions","2.1 Indirect emissions from electricity consumption","2.2 Indirect emissions from energy consumption (other than electricity)","4.1 Purchases of goods","4.2 Capital goods","4.3 Waste management","4.4 Upstream leased assets","5.2 Downstream leased assets"]},
  m_fin:{type:"Spend-based module", about:"This module uses accounting data to provide an initial overview of Scope 1, Scope 2, and Scope 3 upstream emissions. This overview is used to identify significant emission sources, which can then be more accurately calculated using activity data. The module also ensures that most gaps in activity data are covered.", data:["List of expenses"], scopes:["1.1 Direct emissions from stationary combustion sources","1.2 Direct emissions from mobile combustion sources","2.1 Indirect emissions from electricity consumption","2.2 Indirect emissions from energy consumption (other than electricity)","3.1 Upstream transport","3.5 Business travel","4.1 Purchases of goods","4.2 Capital goods","4.4 Upstream leased assets","4.5 Purchases of services"]},
  m_emp:{type:"Activity-based module", about:"This module calculates emissions from employee commuting and teleworking.", data:["Commuting habits (e.g., number of days per week, transport mode, distance)","Teleworking habits (e.g., number of days per week, heating, air conditioning)"], scopes:["3.3 Commuting","6.1 Other indirect emissions"]},
  m_it:{type:"Activity-based module", about:"This module calculates emissions from the manufacture of IT equipment owned or leased by the company.", data:["Equipment type (e.g., Laptop)","Brand (e.g., Dell)","Model (e.g., EliteBook 755 G4 Notebook PC)","Number of units purchased (unit)"], scopes:["4.1 Purchases of goods","4.2 Capital goods"]},
  m_dfreight:{type:"Activity-based module", about:"This module calculates emissions from the transport and distribution of products sold, after they leave the company's control.", data:["Transport mode (e.g., road, sea, air)","Distance (km)","Weight shipped (tonnes, tonne-km)"], scopes:["3.4 Downstream transport","4.1 Purchases of goods"]},
  m_visit:{type:"Activity-based module", about:"This module calculates emissions from the travel of visitors and clients to the company's sites.", data:["Transport mode (e.g., car, train, plane)","Number of visitors","Distance travelled (km)"], scopes:["3.6 Business travel","6.1 Other indirect emissions"]},
  m_travel:{type:"Activity-based module", about:"This module calculates emissions from business travel undertaken by employees, including flights, trains, and accommodation.", data:["Transport mode (e.g., plane, train, car)","Distance (km, passenger-km)","Number of nights of accommodation"], scopes:["3.5 Business travel"]},
  m_cons:{type:"Activity-based module", about:"This module calculates emissions associated with consultants and contractors working on behalf of the company.", data:["Number of contractors","Days worked","Type of service provided"], scopes:["4.5 Purchases of services","6.1 Other indirect emissions"]},
  m_fleet:{type:"Activity-based module", about:"This module calculates emissions from the company's owned or long-term leased vehicle fleet.", data:["Vehicle type and fuel","Distance travelled (km)","Fuel consumed (L, kWh)"], scopes:["1.2 Direct emissions from mobile combustion sources","4.4 Upstream leased assets"]},
  m_cloud:{type:"Activity-based module", about:"This module calculates emissions from cloud computing and hosted digital services used by the company.", data:["Cloud provider","Service type and usage","Storage and compute volume"], scopes:["4.1 Purchases of goods","4.5 Purchases of services"]},
  m_ads:{type:"Activity-based module", about:"This module calculates emissions associated with the company's digital advertising activity.", data:["Ad platform","Impressions / spend","Campaign duration"], scopes:["4.5 Purchases of services","6.1 Other indirect emissions"]},
};

// init plan selection: mandatory => all entities; everything else empty
(function initPlan(){
  Object.values(PLAN_MODULES).flat().forEach(m=>{
    state.planSel[m.id] = new Set(m.prio==='mandatory' ? PLAN_ENTITIES.map(e=>e.id) : []);
  });
})();
SCOPES.forEach(s=>{ if(s.questions) s.questions.forEach(q=>{
  state.answers[q.id] = { bulk:true, bulkValue:null, perEntity:{} };
});});

/* ----------------- Render helpers ----------------- */
const tabsetEl = document.getElementById('tabset');
const topnavActionsEl = document.getElementById('topnavActions');
const contentAreaEl = document.getElementById('contentArea');
const scrollEl = document.getElementById('scroll');

function scopeCounts(scope){
  if(!scope.questions) return null;
  let answered=0;
  scope.questions.forEach(q=>{
    const a=state.answers[q.id];
    if(a.bulk){ if(a.bulkValue) answered++; }
    else { const vals=Object.values(a.perEntity); if(vals.length===ENTITIES.length && vals.every(v=>v)) answered++; }
  });
  return {answered, total:scope.questions.length};
}

function renderStepper(delegatedDone, submittedDone){
  let html='';
  SCOPES.forEach((s,i)=>{
    let cls, num;
    if(submittedDone){
      cls='step done';
      num='<i class="ti ti-check" style="font-size:14px"></i>';
    } else if(delegatedDone){
      const done = (s.key==='setup' || s.key==='summary');
      cls='step'+(done?' done':'');
      num = done ? '<i class="ti ti-check" style="font-size:14px"></i>' : (i+1);
    } else {
      cls='step'+(i===state.stepIndex?' active':'')+(i<state.stepIndex?' done':'');
      num = i<state.stepIndex ? '<i class="ti ti-check" style="font-size:14px"></i>' : (i+1);
    }
    const counts=scopeCounts(s);
    const interactive = !delegatedDone && !submittedDone;
    const onclick = interactive ? `onclick="goToStep(${i})"` : '';
    html+=`<div class="${cls}" style="cursor:${interactive?'pointer':'default'}" ${onclick}>
        <div class="num">${num}</div>
        <div><div class="stxt">${s.label}</div>${counts?`<div class="scount">${counts.answered}/${counts.total}</div>`:''}</div>
      </div>`;
    if(i<SCOPES.length-1) html+='<div class="connector"></div>';
  });
  return html;
}

function renderSetup(){
  return `
  <div class="panel">
    <h2>How would you like to complete this survey?</h2>
    <div class="alert">
      <i class="ti ti-bulb lead"></i>
      <div class="txt"><b>Tip:</b> If your entities share similar activities and you're familiar with how they operate, we recommend answering the survey yourself. Delegating the survey means each entity will choose their own data collection modules, tailoring what activity data they collect.</div>
      <button class="close" onclick="this.parentElement.style.display='none'"><i class="ti ti-x"></i></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="radio-card ${state.delegation==='answer'?'sel':''}" onclick="setDelegation('answer')">
        <span class="lbl">Answer for all entities</span>
        <span class="chip">Recommended</span>
        <span class="radio"></span>
      </div>
      <div class="radio-card ${state.delegation==='delegate'?'sel':''}" onclick="setDelegation('delegate')">
        <span class="lbl">Delegate all to entities</span>
        <span class="radio"></span>
      </div>
    </div>
    <button class="accordion" onclick="togglePreview()">See survey preview <i class="ti ti-chevron-${state.previewOpen?'up':'down'}"></i></button>
    ${state.previewOpen?renderSurveyPreview():''}
  </div>`;
}

function renderSurveyPreview(){
  // Flatten questions across scopes, preserving scope grouping
  const groups = SCOPES.filter(s=>s.questions).map(s=>({label:s.label, questions:s.questions}));
  // Build flat row list with group headers, respecting show-all limit
  const LIMIT = 5; // rows (excluding group headers) shown before "Show all"
  let count=0, rows='', truncated=false;
  for(const g of groups){
    let groupRows='';
    for(const q of g.questions){
      if(!state.previewShowAll && count>=LIMIT){ truncated=true; break; }
      const chip = q.chip ? q.chip.replace(/^Scope\s*/,'') : 'Scope placeholder';
      groupRows+=`<tr class="prev-row">
        <td><span class="prev-chip">${chip}</span></td>
        <td class="prev-q">${q.text}</td>
      </tr>`;
      count++;
    }
    if(groupRows){
      rows+=`<tr class="prev-group"><td colspan="2">${g.label.toUpperCase()}</td></tr>`+groupRows;
    }
    if(truncated) break;
  }
  const totalQ = groups.reduce((n,g)=>n+g.questions.length,0);
  const showAllBtn = (totalQ>LIMIT) ? `<tr><td colspan="2" class="prev-showall">
      <button onclick="togglePreviewShowAll()">${state.previewShowAll?'Show less':'Show all'} <i class="ti ti-chevron-${state.previewShowAll?'up':'down'}"></i></button>
    </td></tr>` : '';
  return `<div class="prev-table-wrap">
    <table class="prev-table">
      <thead><tr><th style="width:280px">Scope</th><th>Questions</th></tr></thead>
      <tbody>${rows}${showAllBtn}</tbody>
    </table>
  </div>`;
}
function togglePreview(){ state.previewOpen=!state.previewOpen; render(); }
function togglePreviewShowAll(){ state.previewShowAll=!state.previewShowAll; render(); }
function openDelegateModal(){ state.showDelegateModal=true; render(); }
function closeDelegateModal(){ state.showDelegateModal=false; render(); }
function confirmDelegate(){ state.showDelegateModal=false; state.delegated=true; render(); scrollEl.scrollTop=0; }
function openSubmitModal(){ state.showSubmitModal=true; render(); }
function closeSubmitModal(){ state.showSubmitModal=false; render(); }
function confirmSubmit(){ state.showSubmitModal=false; state.submitted=true; render(); scrollEl.scrollTop=0; }
function unsubmit(){ state.submitted=false; state.activeTab='survey'; render(); scrollEl.scrollTop=0; }
function undoDelegate(){ state.delegated=false; render(); scrollEl.scrollTop=0; }

function renderDelegatedView(){
  return `<div class="panel" style="gap:24px;">
    <div class="delegated-check"><i class="ti ti-check"></i></div>
    <h2 style="font-size:var(--fs-h2);line-height:var(--lh-h2);letter-spacing:var(--ls-h2);">Survey &amp; collection plan delegated to your entities</h2>
    <p style="font-size:var(--fs-body1);line-height:var(--lh-body1);color:var(--text-secondary);margin:0;max-width:760px;">Each entity has been notified and can now complete their own survey. They'll select their data collection modules directly from their account.</p>
    <div class="alert" style="max-width:none;">
      <i class="ti ti-info-circle lead"></i>
      <div class="txt">Need to change how the survey is answered? <a class="link-inline">Contact our support team</a>.</div>
    </div>
    <button class="btn btn-outline" style="align-self:flex-start;" onclick="undoDelegate()"><i class="ti ti-chevron-left"></i>Review answer</button>
  </div>`;
}

function renderDelegateModal(){
  return `<div class="modal-overlay" onclick="if(event.target===this)closeDelegateModal()">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3 class="modal-title">Delegate the survey to all entities?</h3>
          <p class="modal-sub">Each entity will answer for themselves.</p>
        </div>
        <button class="modal-x" onclick="closeDelegateModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal-info">
        <i class="ti ti-info-circle"></i>
        <span>You won't be able to select data collection modules for them from this consolidated account.</span>
      </div>
      <p class="modal-body">Choose this if your entities know their own activities best and you'd rather let them tailor their data collection plan.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeDelegateModal()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmDelegate()">Delegate to entities</button>
      </div>
    </div>
  </div>`;
}

function renderScope(scope){
  const q = scope.questions[state.qIndex];
  const a = state.answers[q.id];
  let html='<div class="panel">';
  html+=`<div class="q-block">
      <div class="q-head">
        <div class="q-text">${q.text}</div>
        <div class="scope-chip">${q.chip}</div>
        ${q.real?'':'<div class="placeholder-note">Placeholder — final copy to be added</div>'}
      </div>`;

  // Bulk-answer callout
  html+=`<div class="bulk-callout">
      <i class="ti ti-rocket"></i>
      <div class="bulk-txt">
        <div class="lbl">Apply the same answer to all ${ENTITIES.length} entities</div>
        <div class="hint">Switch off to set different answers for specific entities</div>
      </div>
      <div class="bulk-toggle">
        <button class="switch ${a.bulk?'on':''}" onclick="toggleBulk('${q.id}')" aria-label="Bulk answer"></button>
        <span class="bulk-label">Bulk answer</span>
      </div>
    </div>`;

  if(a.bulk){
    html+=`<div class="yesno-stack">
      <button class="answer-card ${a.bulkValue==='yes'?'sel':''}" onclick="setBulkValue('${q.id}','yes')">
        <i class="ti ti-check answer-icon"></i><span class="answer-lbl">Yes</span>
        <span class="radio ${a.bulkValue==='yes'?'on':''}"></span>
      </button>
      <button class="answer-card ${a.bulkValue==='no'?'sel':''}" onclick="setBulkValue('${q.id}','no')">
        <i class="ti ti-x answer-icon"></i><span class="answer-lbl">No</span>
        <span class="radio ${a.bulkValue==='no'?'on':''}"></span>
      </button>
    </div>`;
  } else {
    html+=renderEntityTable(q.id);
  }
  html+='</div></div>';
  return html;
}

function renderEntityTable(qid){
  const a=state.answers[qid];
  const f=state.filters;
  const visible = ENTITIES.filter(e=>{
    if(f.search && !(e.name.toLowerCase().includes(f.search.toLowerCase())||e.country.toLowerCase().includes(f.search.toLowerCase())||e.industry.toLowerCase().includes(f.search.toLowerCase()))) return false;
    if(f.country && e.country!==f.country) return false;
    if(f.industry && e.industry!==f.industry) return false;
    if(f.answer==='Answered' && !a.perEntity[e.name]) return false;
    if(f.answer==='Unanswered' && a.perEntity[e.name]) return false;
    return true;
  });
  const visibleNames = new Set(visible.map(e=>e.name));
  const allVisibleSelected = visible.length>0 && visible.every(e=>state.selected.has(e.name));
  let rows='';
  visible.forEach((e)=>{
    const v=a.perEntity[e.name]||null;
    const checked=state.selected.has(e.name);
    rows+=`<tr data-entity="${e.name}">
      <td class="cb-cell"><button class="cbox ${checked?'on':''}" onclick="toggleRowSelect('${e.name.replace(/'/g,"\\'")}')" aria-label="Select row">${checked?'<i class="ti ti-check"></i>':''}</button></td>
      <td><span class="ent-placeholder"><i class="ti ti-table"></i>${e.name}</span></td>
      <td class="cell-muted">${e.country}</td>
      <td class="cell-muted">${e.industry}</td>
      <td class="answer-cell">
        <button class="ans-btn ${v==='yes'?'ans-yes':''}" onclick="setEntityValue('${qid}','${e.name.replace(/'/g,"\\'")}','yes')"><i class="ti ti-check"></i>Yes</button>
        <button class="ans-btn ${v==='no'?'ans-no':''}" onclick="setEntityValue('${qid}','${e.name.replace(/'/g,"\\'")}','no')"><i class="ti ti-x"></i>No</button>
      </td>
    </tr>`;
  });
  if(visible.length===0){
    rows=`<tr><td colspan="5" class="no-results">No entities match these filters. <button class="bulk-clear" onclick="clearFilters()">Clear filters</button></td></tr>`;
  }

  return `<div class="datagrid">
    <div class="grid-sticky">
      <div class="grid-toolbar">
        <div class="search"><i class="ti ti-search"></i><input placeholder="Search entity..." value="${f.search}" oninput="setSearch(this.value)"></div>
        ${filterDropdown('country','Country', [...new Set(ENTITIES.map(e=>e.country))])}
        ${filterDropdown('industry','Industry', [...new Set(ENTITIES.map(e=>e.industry))])}
        ${filterDropdown('answer','Answer status', ['Answered','Unanswered'])}
        ${activeFilterCount()>0?`<button class="clear-filters" onclick="clearFilters()">Clear filters</button>`:''}
      </div>
      <div class="result-meta">${visible.length} of ${ENTITIES.length} entities</div>
    </div>
    <div class="grid-scroll">
      <table class="ent-table" id="table-${qid}">
        <thead><tr>
          <th class="cb-cell"><button class="cbox ${allVisibleSelected?'on':''}" onclick="toggleSelectAll('${qid}')" aria-label="Select all">${allVisibleSelected?'<i class="ti ti-check"></i>':''}</button></th>
          <th>Entity</th><th>Country</th><th>Industry</th><th>Answer</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function filterDropdown(key,label,options){
  const val=state.filters[key];
  const isOpen=state.openMenu===key;
  const display = val || label;
  const menu = isOpen ? `<div class="filter-menu">
      <button class="filter-opt ${!val?'sel':''}" onclick="setFilter('${key}','')">All</button>
      ${options.map(o=>`<button class="filter-opt ${val===o?'sel':''}" onclick="setFilter('${key}','${o.replace(/'/g,"\\'")}')">${o}${val===o?'<i class=\"ti ti-check\"></i>':''}</button>`).join('')}
    </div>` : '';
  return `<div class="select-wrap">
    <div class="select-box ${val?'active':''}" onclick="toggleMenu('${key}')">
      <span>${display}</span>
      ${val?`<i class="ti ti-x clear-x" onclick="event.stopPropagation();setFilter('${key}','')"></i>`:`<i class="ti ti-chevron-down"></i>`}
    </div>
    ${menu}
  </div>`;
}
function activeFilterCount(){
  const f=state.filters; return [f.country,f.industry,f.answer].filter(Boolean).length;
}

function questionAnswerSummary(q){
  // returns {yes:count|null, no:count|null} where 'All' = ENTITIES.length
  const a=state.answers[q.id];
  if(a.bulk){
    if(a.bulkValue==='yes') return {yes:'All', no:null};
    if(a.bulkValue==='no') return {yes:null, no:'All'};
    return {yes:null, no:null};
  }
  let yes=0,no=0;
  Object.values(a.perEntity).forEach(v=>{ if(v==='yes')yes++; else if(v==='no')no++; });
  return {yes:yes||null, no:no||null};
}

function renderSummary(){
  let rows='';
  SCOPES.filter(s=>s.questions).forEach(scope=>{
    rows+=`<tr class="sum-group"><td colspan="5">${scope.label.toUpperCase()}</td></tr>`;
    scope.questions.forEach(q=>{
      const s=questionAnswerSummary(q);
      const chip=(val,kind)=> val===null ? '' :
        `<span class="count-chip"><i class="ti ti-building"></i>${val}</span>`;
      rows+=`<tr class="sum-row">
        <td><span class="scope-chip scope-chip-trunc" title="${q.chip.replace(/"/g,'&quot;')}">${q.chip.replace(/^Scope\s*/,'')}</span></td>
        <td class="sum-q">${q.text}</td>
        <td>${chip(s.yes,'yes')}</td>
        <td>${chip(s.no,'no')}</td>
        <td class="sum-edit"><button class="edit-link" onclick="editQuestion('${scope.key}','${q.id}')">Edit <i class="ti ti-chevron-right"></i></button></td>
      </tr>`;
    });
  });
  return `<div class="panel">
    <div class="sum-table-wrap">
      <div class="sum-toolbar">
        <div class="search" style="width:280px;"><i class="ti ti-search"></i><input placeholder="Search question..."></div>
        <button class="icon-btn" title="Export"><i class="ti ti-download"></i></button>
      </div>
      <table class="ent-table sum-table">
        <thead><tr><th style="width:240px">Scope</th><th>Questions</th><th style="width:90px">Yes</th><th style="width:90px">No</th><th style="width:90px"></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="sum-pagination">
        <span>Rows per page: 15 <i class="ti ti-chevron-down"></i></span>
        <span>1-${SCOPES.filter(s=>s.questions).reduce((n,s)=>n+s.questions.length,0)} of ${SCOPES.filter(s=>s.questions).reduce((n,s)=>n+s.questions.length,0)}</span>
        <span class="pag-arrows"><button class="icon-btn"><i class="ti ti-chevron-left"></i></button><button class="icon-btn"><i class="ti ti-chevron-right"></i></button></span>
      </div>
    </div>
  </div>`;
}

function editQuestion(scopeKey,qid){
  const si=SCOPES.findIndex(s=>s.key===scopeKey);
  if(si<0) return;
  const qi=SCOPES[si].questions.findIndex(q=>q.id===qid);
  state.stepIndex=si; state.qIndex=qi>=0?qi:0;
  render(); scrollEl.scrollTop=0;
}

/* ----------------- Actions ----------------- */
function setDelegation(v){ state.delegation=v; render(); }
function toggleBulk(qid){ state.answers[qid].bulk=!state.answers[qid].bulk; state.selected.clear();
  state.filters={search:"",country:"",industry:"",answer:""}; state.openMenu=null; render(); }
function setBulkValue(qid,v){ state.answers[qid].bulkValue = state.answers[qid].bulkValue===v?null:v; render(); }
function setEntityValue(qid,name,v){
  const pe=state.answers[qid].perEntity;
  pe[name] = pe[name]===v?null:v;
  renderTableOnly();
}
function toggleRowSelect(name){
  if(state.selected.has(name)) state.selected.delete(name); else state.selected.add(name);
  renderTableOnly();
}
function toggleSelectAll(qid){
  const a=state.answers[qid]; const f=state.filters;
  const visible = ENTITIES.filter(e=>{
    if(f.search && !(e.name.toLowerCase().includes(f.search.toLowerCase())||e.country.toLowerCase().includes(f.search.toLowerCase())||e.industry.toLowerCase().includes(f.search.toLowerCase()))) return false;
    if(f.country && e.country!==f.country) return false;
    if(f.industry && e.industry!==f.industry) return false;
    if(f.answer==='Answered' && !a.perEntity[e.name]) return false;
    if(f.answer==='Unanswered' && a.perEntity[e.name]) return false;
    return true;
  });
  const allSel = visible.length>0 && visible.every(e=>state.selected.has(e.name));
  if(allSel) visible.forEach(e=>state.selected.delete(e.name));
  else visible.forEach(e=>state.selected.add(e.name));
  renderTableOnly();
}
function clearSelection(){ state.selected.clear(); renderTableOnly(); }
function applyToSelected(qid,v){
  const pe=state.answers[qid].perEntity;
  state.selected.forEach(name=>{ pe[name]=v; });
  state.selected.clear();
  renderTableOnly();
}
function setSearch(v){ state.filters.search=v; renderTableOnly(); }
function setFilter(key,val){ state.filters[key]=val; state.openMenu=null; render(); }
function toggleMenu(key){ state.openMenu = state.openMenu===key?null:key; render(); }
function clearFilters(){ state.filters={search:"",country:"",industry:"",answer:""}; state.openMenu=null; render(); }

// re-render only the table area so the search input keeps focus and scroll position
function renderTableOnly(){
  const scope=SCOPES[state.stepIndex];
  if(!scope.questions) return;
  const q=scope.questions[state.qIndex];
  if(state.answers[q.id].bulk) return;
  const container=document.querySelector('.datagrid');
  if(!container) return;
  const active=document.activeElement;
  const caret=active&&active.tagName==='INPUT'?active.selectionStart:null;
  const prevScroll=document.querySelector('.grid-scroll');
  const scrollTop=prevScroll?prevScroll.scrollTop:0;
  container.outerHTML=renderEntityTable(q.id);
  const newScroll=document.querySelector('.grid-scroll');
  if(newScroll) newScroll.scrollTop=scrollTop;
  const newInput=document.querySelector('.search input');
  if(newInput && active && active.tagName==='INPUT'){ newInput.focus(); if(caret!=null) newInput.setSelectionRange(caret,caret); }
  updateFooter();
}

// answered count for current question (used in footer)
function questionAnswered(q){
  const a=state.answers[q.id];
  if(a.bulk) return a.bulkValue ? ENTITIES.length : 0;
  return Object.values(a.perEntity).filter(v=>v).length;
}

function goToStep(i){
  if(i<0||i>SCOPES.length-1) return;
  state.stepIndex=i;
  state.qIndex=0;
  state.selected.clear();
  state.filters={search:"",country:"",industry:"",answer:""}; state.openMenu=null;
  render();
  scrollEl.scrollTop=0;
}

// advance one question; roll into next scope when at the last question
function advance(){
  const scope=SCOPES[state.stepIndex];
  state.selected.clear();
  state.filters={search:"",country:"",industry:"",answer:""}; state.openMenu=null;
  if(scope.questions && state.qIndex < scope.questions.length-1){
    state.qIndex++; render(); scrollEl.scrollTop=0;
  } else if(state.stepIndex < SCOPES.length-1){
    goToStep(state.stepIndex+1);
  }
}
function goBack(){
  const scope=SCOPES[state.stepIndex];
  state.selected.clear();
  state.filters={search:"",country:"",industry:"",answer:""}; state.openMenu=null;
  if(scope.questions && state.qIndex>0){
    state.qIndex--; render(); scrollEl.scrollTop=0;
  } else if(state.stepIndex>0){
    const prev=SCOPES[state.stepIndex-1];
    state.stepIndex--;
    state.qIndex = prev.questions ? prev.questions.length-1 : 0;
    render(); scrollEl.scrollTop=0;
  }
}

function planModulesSelectedCount(){
  // total module-per-entity assignments (e.g. 3 mandatory × 20 entities = 60)
  return Object.values(state.planSel).reduce((n,set)=>n+set.size,0);
}
function planEntityModuleCount(eid){
  let n=0; Object.values(state.planSel).forEach(set=>{ if(set.has(eid)) n++; });
  return n;
}
// is this module essential FOR this entity? mandatory => always; high => only if entity is in its relevant group
function moduleEssentialForEntity(m,eid){
  if(m.prio==='mandatory') return true;
  if(m.prio==='high'){ const rel=m.relevant||PLAN_ENTITIES.map(e=>e.id); return rel.includes(eid); }
  return false;
}
function planEntityEssentialsComplete(eid){
  return Object.values(PLAN_MODULES).flat()
    .filter(m=>moduleEssentialForEntity(m,eid))
    .every(m=>state.planSel[m.id].has(eid));
}
function planEntityMissingHigh(eid){
  return Object.values(PLAN_MODULES).flat()
    .filter(m=>m.prio==='high' && moduleEssentialForEntity(m,eid) && !state.planSel[m.id].has(eid))
    .length;
}
function planEntityExtra(eid){
  // extra = modules added beyond the 7-module package for this entity
  return Math.max(0, planEntityModuleCount(eid) - PACKAGE_SIZE);
}

  const totalEnt=PLAN_ENTITIES.length;

  const metrics=`<div class="plan-metrics">
    <div class="metric-card">
      <div class="metric-head"><i class="ti ti-layout-grid"></i>Modules selected<i class="ti ti-info-circle metric-i"></i></div>
      <div class="metric-num">${modsSelected} <span class="metric-den">across ${totalEnt} entities</span></div>
      <div class="metric-foot">Your package includes 7 modules per entity</div>
    </div>
    <div class="metric-card">
      <div class="metric-head"><i class="ti ti-shield"></i>Entities with all essentials modules<i class="ti ti-info-circle metric-i"></i></div>
      <div class="metric-num">${essentialsComplete} <span class="metric-den">/${totalEnt}</span></div>
      <div class="metric-foot">${essentialsComplete<totalEnt?`<span class="metric-warn"><i class="ti ti-alert-triangle"></i>${missingHigh} high-priority modules missing</span>`:'<span class="metric-ok"><i class="ti ti-circle-check"></i>All essentials covered</span>'}</div>
    </div>

      <div class="metric-head"><i class="ti ti-diamond"></i>Entities with extra modules<i class="ti ti-info-circle metric-i"></i></div>

      <div class="metric-foot">${PLAN_ENTITIES.reduce((n,e)=>n+planEntityExtra(e.id),0)} extra modules added beyond package</div>
    </div>
  </div>`;

  const toggle=`<div class="plan-toggle">

    </div>
    <div class="plan-help-actions">
      <button class="btn btn-outline"><i class="ti ti-search"></i>Browse full library</button>

  return `<div class="plan-wrap">
    <div class="info-banner"><i class="ti ti-info-circle"></i><span><b>Info:</b> To save you time, mandatory modules have already been selected.</span><button class="info-x" onclick="this.parentElement.style.display='none'"><i class="ti ti-x"></i></button></div>

function renderPlanView(){
  let blocks='';
  Object.entries(PLAN_MODULES).forEach(([scopeName,mods])=>{
    let rows='';
    mods.forEach(m=>{
      const p=PRIORITY[m.prio];
      const sel=state.planSel[m.id];
      const locked=p.locked;
      const entityControl = locked
        ? `<div class="entity-select locked"><span class="sel-chip">All</span><i class="ti ti-chevron-down"></i></div>`
        : renderEntitySelect(m.id);
      rows+=`<tr>
        <td><span class="mod-name mod-name-link" onclick="openModuleDrawer('${m.id}')"><span class="mod-icon-tile"><i class="ti ${m.icon}"></i></span><span class="mod-label">${m.name}</span></span></td>
        <td><span class="prio ${p.cls}" data-tip="${m.prio}" onmouseenter="showTip(this,'${m.prio}')" onmouseleave="hideTip()">${p.label}${locked?'<i class="ti ti-lock"></i>':''}</span></td>
        <td class="entity-cell">${entityControl}</td>
      </tr>`;
    });
    blocks+=`<div class="scope-block">
      <h3 class="scope-h">${scopeName}</h3>
      <table class="plan-table">
        <thead><tr><th>Module name</th><th style="width:160px">Priority</th><th style="width:280px">Entity</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  });
  return `<div class="plan-body">${blocks}</div>`;
}

function renderEntitySelect(mid){
  const mod=Object.values(PLAN_MODULES).flat().find(m=>m.id===mid);
  const sel=state.planSel[mid];
  const open=state.planMenuOpen===mid;
  let label='Select';
  if(sel.size===PLAN_ENTITIES.length) label='All';
  else if(sel.size>0) label=`${sel.size} ${sel.size===1?'entity':'entities'}`;

  const relevant = mod.relevant || PLAN_ENTITIES.map(e=>e.id);
  const relevantSet = new Set(relevant);
  const others = PLAN_ENTITIES.filter(e=>!relevantSet.has(e.id)).map(e=>e.id);
  const hasSplit = others.length>0;
  const tierLabel = mod.prio==='medium' ? 'All medium' : 'All high priority';

  const search=state.planEntitySearch.toLowerCase();
  const match=eid=>{ if(!search) return true; const e=PLAN_ENTITIES.find(x=>x.id===eid); return e.name.toLowerCase().includes(search); };

  const allChecked=sel.size===PLAN_ENTITIES.length;
  const grpAllChecked=(ids)=> ids.length>0 && ids.every(id=>sel.has(id));

  const entityRow=(eid,indent)=>{
    const e=PLAN_ENTITIES.find(x=>x.id===eid);
    return `<button class="ent-opt ${indent?'indent':''}" onclick="togglePlanEntity('${mid}','${eid}')"><span class="cbox ${sel.has(eid)?'on':''}">${sel.has(eid)?'<i class="ti ti-check"></i>':''}</span>${e.name}</button>`;
  };

  let menuInner='';
  // Select all
  menuInner+=`<button class="ent-opt" onclick="togglePlanAll('${mid}')"><span class="cbox ${allChecked?'on':''}">${allChecked?'<i class="ti ti-check"></i>':''}</span>Select all (${PLAN_ENTITIES.length})</button>`;

  const grpOpenKey = mid+':grp';
  const otherOpenKey = mid+':other';
  const grpExpanded = !!state.planGroupOpen[grpOpenKey];     // collapsed by default
  const otherExpanded = !!state.planGroupOpen[otherOpenKey]; // collapsed by default

  // Tier group (always shown; if fully relevant, "Other" is just empty/disabled)
  const visibleRel=relevant.filter(match);
  menuInner+=`<div class="ent-group">
    <button class="ent-group-h" onclick="togglePlanGroup('${grpOpenKey}')"><i class="ti ti-chevron-${grpExpanded?'down':'right'} grp-caret"></i><span class="cbox ${grpAllChecked(relevant)?'on':''}" onclick="event.stopPropagation();togglePlanGroupSel('${mid}',[${relevant.map(i=>`'${i}'`).join(',')}])">${grpAllChecked(relevant)?'<i class="ti ti-check"></i>':''}</span>${tierLabel} (${relevant.length})</button>
    ${grpExpanded?visibleRel.map(id=>entityRow(id,true)).join(''):''}
  </div>`;

  // Other group (always shown; disabled when empty)
  const visibleOther=others.filter(match);
  if(others.length>0){
    menuInner+=`<div class="ent-group">
      <button class="ent-group-h" onclick="togglePlanGroup('${otherOpenKey}')"><i class="ti ti-chevron-${otherExpanded?'down':'right'} grp-caret"></i><span class="cbox ${grpAllChecked(others)?'on':''}" onclick="event.stopPropagation();togglePlanGroupSel('${mid}',[${others.map(i=>`'${i}'`).join(',')}])">${grpAllChecked(others)?'<i class="ti ti-check"></i>':''}</span>Other (${others.length})</button>
      ${otherExpanded?visibleOther.map(id=>entityRow(id,true)).join(''):''}
    </div>`;
  } else {
    menuInner+=`<div class="ent-group">
      <div class="ent-group-h disabled"><i class="ti ti-chevron-right grp-caret"></i><span class="cbox"></span>Other (0)</div>
    </div>`;
  }

  const menu = open ? `<div class="entity-menu">
      <div class="search" style="margin:8px;width:auto;"><i class="ti ti-search"></i><input placeholder="Search entities..." value="${state.planEntitySearch}" oninput="setPlanEntitySearch('${mid}',this.value)"></div>
      ${menuInner}
    </div>` : '';
  return `<div class="entity-select-wrap">
    <div class="entity-select ${sel.size>0?'has':''}" onclick="togglePlanMenu('${mid}')">${sel.size>0?`<span class="sel-chip">${label}</span>`:`<span>${label}</span>`}<i class="ti ti-chevron-${open?'up':'down'}"></i></div>
    ${menu}
  </div>`;
}

}
